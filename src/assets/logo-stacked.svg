<svg viewBox="0 0 120 160" xmlns="http://www.w3.org/2000/svg">
  <!-- Window frame icon -->
  <g>
    <!-- Outer frame -->
    <rect x="20" y="10" width="80" height="80" fill="none" stroke="#1a3a5c" stroke-width="2.5"/>
    <!-- Vertical divider -->
    <line x1="60" y1="10" x2="60" y2="90" stroke="#1a3a5c" stroke-width="2.5"/>
    <!-- Horizontal divider -->
    <line x1="20" y1="50" x2="100" y2="50" stroke="#1a3a5c" stroke-width="2.5"/>
  </g>

  <!-- Text -->
  <g>
    <!-- Main text "BB Kozijnen" -->
    <text x="60" y="118" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="18" font-weight="600" fill="#2d2d2d" text-anchor="middle">BB Kozijnen</text>
    
    <!-- Subtext "Kunststof kozijnen op maat" -->
    <text x="60" y="145" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, Segoe UI, sans-serif" font-size="9" fill="#555555" text-anchor="middle">Kunststof kozijnen op maat</text>
  </g>
</svg>
